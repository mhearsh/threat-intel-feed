<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>threat-intel-feed</title>
<style>body{margin:0;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:#14112b;color:#e6e6f0}header{background:linear-gradient(135deg,#1a0b3d,#3b1785 55%,#007f7a);padding:60px 8%}h1{font-size:48px;margin:0}main{padding:30px 8%}a{color:#7ff7ee}.c{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.k{background:#1f1a40;border-radius:12px;padding:18px}.n{font-size:36px;color:#7ff7ee;font-weight:800}code{background:#0d0b1f;padding:2px 6px;border-radius:4px}</style></head>
<body><header><h1>threat-intel-feed</h1><p>High-confidence IOCs: C2, malware and phishing. Updated every 2 hours. Ready for FortiGate, Palo Alto, Sentinel, Defender, Suricata and STIX.</p></header>
<main><div class="c"><div class="k"><div class="n" id="cnt">–</div>IOCs in current feed</div><div class="k"><div class="n" id="fr">–</div>first seen &lt; 6h</div><div class="k"><div class="n" id="up" style="font-size:18px">–</div>last update</div></div>
<h2>Feeds</h2><ul id="f"></ul><p><img src="https://raw.githubusercontent.com/mhearsh/threat-intel-feed/main/assets/families.svg" width="100%" alt="families"></p>
<p><a href="https://github.com/mhearsh/threat-intel-feed">GitHub repository, docs and licence (CC BY 4.0)</a></p></main>
<script>const B='https://raw.githubusercontent.com/mhearsh/threat-intel-feed/main/';fetch(B+'stats.json').then(r=>r.json()).then(s=>{cnt.textContent=s.count;fr.textContent=s.fresh_6h;up.textContent=s.updated});
['fortigate-ip-feed.txt','fortigate-domain-feed.txt','paloalto-edl-ip.txt','paloalto-edl-url.txt','sentinel-watchlist.csv','defender-hunt.kql','suricata.rules','stix21.json','top-iocs.csv'].forEach(n=>{f.innerHTML+=`<li><a href="${B}latest/${n}">${n}</a></li>`})</script></body></html>
